[flake8]
max-line-length = 100
# Agregamos .venv y venv para evitar que analice librerías locales en WSL
exclude = .git,__pycache__,artifacts,mlruns,.github,.venv,venv
# Ignora reglas específicas de formato (conflictos comunes con formateadores como Black)
ignore = E203, W503, D100, D104, E241, E231
per-file-ignores =
    tests/*: D

[tool:pytest]
# Indica a pytest dónde buscar las pruebas y cómo ejecutarlas
testpaths = tests
addopts = -v --tb=short
python_files = test_*.py
python_classes = Test*
python_functions = test_*
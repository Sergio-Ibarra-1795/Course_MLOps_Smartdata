# .github/workflows/ml_pipeline.yml
# CI/CD Pipeline — MLOps Picos de Intensidad
# Se activa con: push a main, pull_request a main o ejecucion manual

name: ML Pipeline CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Permite ejecutar manualmente desde la interfaz de GitHub Actions

env:
  PYTHON_VERSION: '3.10'
  IMAGE_NAME: picos-intensidad-api

jobs:

  # ── JOB 1: Linting y Pruebas Unitarias ──────────────────────────────────────
  lint-and-test:
    name: Lint + Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Actualizar pip e instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Linting de código con flake8
        run: |
          echo '=== Ejecutando flake8 ==='
          flake8 src/ tests/ --config=setup.cfg
          echo 'Linting OK'

      - name: Ejecutar tests unitarios con pytest
        run: |
          echo '=== Ejecutando pytest ==='
          pytest tests/ -v --tb=short --cov=src --cov-report=term-missing

      - name: Subir reporte de cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  # ── JOB 2: Entrenamiento y Validación del Modelo ───────────────────────────
  train-model:
    name: Entrenar Modelo
    runs-on: ubuntu-latest
    needs: lint-and-test  # Solo se ejecuta si el Job 1 aprueba

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar dataset sintético
        run: python src/generate_data.py

      - name: Entrenar el pipeline de ML
        run: python src/train_pipeline.py

      - name: Validar métricas mínimas (Quality Gate)
        run: python src/validate_model.py

      - name: Guardar artefactos del modelo (modelo.pkl y metrics.json)
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/

  # ── JOB 3: Empaquetamiento y Smoke Test en Docker ───────────────────────────
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: train-model  # Solo se ejecuta si el Job 2 generó los artefactos

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Descargar artefactos generados por el entrenamiento
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/

      - name: Construir la imagen Docker
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker build -t ${{ env.IMAGE_NAME }}:latest .

      - name: Smoke Test (verificar que el modelo carga dentro del contenedor)
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:latest python -c \
            'import pickle; m=pickle.load(open("artifacts/modelo.pkl","rb")); \
             print("Modelo verificado exitosamente dentro de Docker:", type(m).__name__)'
name: Monitoreo Semanal de Drift y Performance

on:
  schedule:
    - cron: '0 8 * * 1' # Lunes a las 08:00 UTC
  workflow_dispatch:     # Permite ejecución manual desde la UI de GitHub

jobs:
  ejecutar_pipeline_completo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Orquestador del Pipeline
        run: |
          cd Class09_MonitoreoYMantenimiento/Class09_MonitoreoYMantenimiento_FollowUp
          python src/run_monitoreo.py wine_2026_Q3

      - name: Preservar Artefactos y Reportes
        if: always() # Se ejecuta aunque el orquestador retorne sys.exit(1)
        uses: actions/upload-artifact@v4
        with:
          name: reportes-monitoreo-completo
          path: Class09_MonitoreoYMantenimiento/Class09_MonitoreoYMantenimiento_FollowUp/reportes/
          retention-days: 30
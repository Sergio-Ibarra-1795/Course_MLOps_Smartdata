name: Monitoreo Semanal de Drift y Performance

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ejecutar_pipeline_completo:
    runs-on: ubuntu-latest

    # Establece el subdirectorio de trabajo por defecto para TODOS los comandos 'run'
    defaults:
      run:
        working-directory: Class09_MonitoreYMantenimiento/Class09_MonitoreYMantenimiento_FollowUp

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Orquestador del Pipeline
        run: |
          python src/run_monitoreo.py wine_2026_Q3

      - name: Preservar Artefactos y Reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-monitoreo-completo
          path: Class09_MonitoreYMantenimiento/Class09_MonitoreYMantenimiento_FollowUp/reportes/
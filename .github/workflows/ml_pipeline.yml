# .github/workflows/ml_pipeline.yml
# CI/CD Pipeline — MLOps Picos de Intensidad

name: ML Pipeline CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Permite ejecución manual desde la interfaz de GitHub

env:
  PYTHON_VERSION: '3.10'
  IMAGE_NAME: picos-intensidad-api

# ==============================================================================
# CONFIGURACIÓN CLAVE: Ejecuta todos los comandos dentro de la subcarpeta del proyecto
# ==============================================================================
defaults:
  run:
    working-directory: Class07_CI-CD_basico/Class07_CI-CD_basico_FollowUp

jobs:

  # ── JOB 1: Linting y Pruebas Unitarias ──────────────────────────────────────
  lint-and-test:
    name: Lint + Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: Class07_CI-CD_basico/Class07_CI-CD_basico_FollowUp/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Linting con flake8
        run: flake8 src/ tests/ --config=setup.cfg

      - name: Tests unitarios con pytest
        run: pytest tests/ -v --tb=short --cov=src --cov-report=term-missing

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: Class07_CI-CD_basico/Class07_CI-CD_basico_FollowUp/.coverage

  # ── JOB 2: Entrenamiento y Validación del Modelo ───────────────────────────
  train-model:
    name: Entrenar Modelo
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: Class07_CI-CD_basico/Class07_CI-CD_basico_FollowUp/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar dataset sintético
        run: python src/generate_data.py

      - name: Entrenar pipeline de ML
        run: python src/train_pipeline.py

      - name: Validar métricas mínimas (Quality Gate)
        run: python src/validate_model.py

      - name: Guardar artefactos del modelo
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: Class07_CI-CD_basico/Class07_CI-CD_basico_FollowUp/artifacts/

  # ── JOB 3: Empaquetamiento y Smoke Test en Docker ───────────────────────────
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: train-model

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Descargar artefactos del modelo
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: Class07_CI-CD_basico/Class07_CI-CD_basico_FollowUp/artifacts/

      - name: Build de la imagen Docker
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker build -t ${{ env.IMAGE_NAME }}:latest .

      - name: Smoke test dentro del contenedor
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:latest python -c \
            'import pickle; m=pickle.load(open("artifacts/modelo.pkl","rb")); \
             print("Modelo verificado exitosamente dentro de Docker:", type(m).__name__)'
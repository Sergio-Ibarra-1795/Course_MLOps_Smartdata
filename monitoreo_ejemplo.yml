name: Monitoreo Semanal de Drift y Performance

on:
  schedule:
    # Corre automáticamente todos los lunes a las 08:00 UTC
    - cron: '0 8 * * 1'
  # Permite ejecutarlo manualmente desde la pestaña "Actions" de GitHub
  workflow_dispatch:

jobs:
  monitorear_modelo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Pipeline de Monitoreo (Quality Gate)
        run: |
          # Navegamos a la carpeta de la clase correspondiente
          cd Class09_MonitoreoYMantenimiento/Class09_MonitoreoYMantenimiento_FollowUp
          python src/04_pipeline_monitoreo.py

      - name: Subir Reportes HTML y JSON como Artefactos
        if: always() # Se ejecuta aunque el paso anterior haya fallado (Exit Code 1)
        uses: actions/upload-artifact@v4
        with:
          name: reportes-drift-y-performance
          path: Class09_MonitoreoYMantenimiento/Class09_MonitoreoYMantenimiento_FollowUp/reportes/
          retention-days: 30